name: Java Battleship Push Workflow

on:
  push:
    branches:
      - '**'

jobs:
  # Job 1: Compile and test the code
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build and Test with Maven
        run: mvn -B clean verify checkstyle:checkstyle spotbugs:spotbugs pmd:pmd pmd:cpd

      # Upload the Maven target folder so the next jobs can reuse it without rebuilding
      - name: Upload build output
        uses: actions/upload-artifact@v6
        with:
          name: build-output
          path: target/

  # Job 2: Publish analysis annotations to GitHub Actions summary
  publish-reports:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Download the target folder produced by the build job
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: target/

      - name: Publish Checkstyle
        uses: jwgmeligmeyling/checkstyle-github-action@master
        with:
          path: '**/checkstyle-result.xml'

      - name: Publish SpotBugs
        uses: jwgmeligmeyling/spotbugs-github-action@master
        with:
          path: '**/spotbugsXml.xml'

      - name: Publish PMD
        uses: jwgmeligmeyling/pmd-github-action@master
        with:
          path: '**/pmd.xml'

  # Job 3: Upload all artifacts for download
  upload-artifacts:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    permissions:
      contents: read
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: target/

      - name: Upload JAR file
        uses: actions/upload-artifact@v6
        with:
          name: battleship-jar
          path: target/*.jar

      - name: Upload Analysis Report
        uses: actions/upload-artifact@v6
        with:
          name: Analysis report
          path: |
            target/site/jacoco/
            target/reports/pmd.html
            target/reports/cpd.html
            target/reports/checkstyle.html
            target/site/spotbugs.html

  # Job 4: Enforce quality gates, fails the workflow if violations found
  quality-gates:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: target/

      - name: Enforce Quality Gates
        run: mvn -B checkstyle:check spotbugs:check pmd:check pmd:cpd-check
